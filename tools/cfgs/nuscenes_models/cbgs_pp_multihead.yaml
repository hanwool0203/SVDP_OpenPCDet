CLASS_NAMES: ['car','truck', 'construction_vehicle', 'bus', 'trailer',
              'barrier', 'motorcycle', 'bicycle', 'pedestrian', 'traffic_cone'] 
              # 모델이 탐지해야 할 모든 클래스의 목록
              # 이 리스트를 기준으로 1-based indexing을 사용 (1~10까지)

DATA_CONFIG: # nuScenes 데이터를 모델에 입력하기 전에 "전처리"를 어떻게 할 지에 대해 정의
    _BASE_CONFIG_: cfgs/dataset_configs/nuscenes_dataset.yaml # "상속" 기능 -> train.py를 실행했을 때 이 파일의 설정값을 읽기 전nuscenes_dataset.yaml 파일의 모든 설정을 불러온다. -> 만약 두 파일에 같은 설정이 있으면, 뒤에 있는 파일 (즉 이 파일)의 설정이 Override한다!

    POINT_CLOUD_RANGE: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0] # 모델이 처리할 3D 공간의 경계 [x_min, y_min, z_min, x_max, y_max, z_max] (미터 단위) -> 이 범위를 벗어나는 모든 포인트 클라우드와 GT 박스는 "데이터 로딩" 단계에서 제거
    DATA_PROCESSOR: # 데이터 전처리 파이프라인 
        -   NAME: mask_points_and_boxes_outside_range
            REMOVE_OUTSIDE_BOXES: True # POINT_CLOUD_RANGE 설정을 실행하는 함수 -> 이 함수가 어디에 구현되어 있는지 확인해야 함.

        -   NAME: shuffle_points
            SHUFFLE_ENABLED: {
                'train': True,
                'test': True
            } # 포인트 클라우드의 순서를 섞어주는 함수 -> PillarVFE는 포인트 순서에 대해 영향을 받지 않아야하므로 순서를 섞어주면 모델의 강건성이 향상

        -   NAME: transform_points_to_voxels # PointPillars의 Pillar 생성 단계 
            VOXEL_SIZE: [0.2, 0.2, 8.0] # Pillar 한 개의 크기를 정의 (가로 : 20cm, 세로 : 20cm, 높이 8m) 높이가 8m인 이유는 아까 포인트 클라우드 range에서 8m로 지정했기 때문 ! 압축할 거니까 이 높이를 맞춰주어야 한다.
            MAX_POINTS_PER_VOXEL: 20 # Pillar 1개에 담을 수 있는 최대 포인트 수 -> 20개 넘으면 무작위 샘플링
            MAX_NUMBER_OF_VOXELS: {
                'train': 30000,
                'test': 30000
            } # 한 프레임(Scene)에서 사용할 Pillar의 최대 개수 -> 30,000개가 넘으면 무작위로 30,000개만 샘플링 (GPU 메모리 폭발 방지용)

MODEL: # 모델의 아키텍처 구조를 정의하는 핵심적인 섹션
    NAME: PointPillar # pcdet/models/detectors/pointpillar.py 파일을 로드하라는 의미 -> 파이썬 파일이 VFE, Backbone, Head를 조립

    VFE:
        NAME: PillarVFE # pcdet/models/backbones_3d/vfe/pillar_vfe.py 파일을 로드 -> MAX_POINTS_PER_VOXEL (20개)의 포인트를 입력받아 Pillar Feature Net을 통과시켜 하나의 feature vector를 만든다. 
        WITH_DISTANCE: False 
        USE_ABSLOTE_XYZ: True
        USE_NORM: True
        NUM_FILTERS: [64] # 최종 출력 차원 (filter의 개수가 출력의 차원이 되는 것 -> 왜냐면 Shared-MLP(Conv1D)이니까!) 즉, (20, 5) (포인트 20개 x 특징 5개) ➡️ PFN ➡️ (1, 64) (64차원 특징 벡터 1개)

    MAP_TO_BEV:
        NAME: PointPillarScatter # pcdet/models/map_to_bev/pointpillar_scatter.py 파일을 로드 -> VFE가 만든 (N, 64) 크기의 Pillar 특징들을 2D 그리드 상의 올바른 (x, y) 좌표에 "흩뿌려서(scatter)" 2D 유사 이미지(Pseudo-Image)를 생성
        NUM_BEV_FEATURES: 64 # 입력 채널이 64임을 확인

    BACKBONE_2D: # pcdet/models/backbones_2d/base_bev_backbone.py 파일을 로드
        NAME: BaseBEVBackbone 
        LAYER_NUMS: [3, 5, 5]
        LAYER_STRIDES: [2, 2, 2]
        NUM_FILTERS: [64, 128, 256] # 2D 유사 이미지를 3번 다운 샘플링하면서 feature map을 깊게 만든다.
        UPSAMPLE_STRIDES: [0.5, 1, 2]
        NUM_UPSAMPLE_FILTERS: [128, 128, 128] # 다운 샘플링된 3개의 feature map을 업샘플링하여 모두 합친다. (Concatenate) 
        # 이 방식은 FPN과 유사, 최종 head가 더 풍부한 정보 (작은 객체 & 큰 객체)를 보게 해준다.

    DENSE_HEAD: # pcdet/models/dense_heads/anchor_head_multi.py 파일을 로드
        NAME: AnchorHeadMulti # 이것이 최종 detection head이며 논문에서 말하는 SSD 방식의 head
        CLASS_AGNOSTIC: False

        DIR_OFFSET: 0.78539
        DIR_LIMIT_OFFSET: 0.0
        NUM_DIR_BINS: 2

        USE_MULTIHEAD: True # 1개의 거대한 head가 10개의 클래스를 모두 예측하는 것이 아니라, 6개의 작은 헤드로 작업을 분산
        SEPARATE_MULTIHEAD: True
        ANCHOR_GENERATOR_CONFIG: [ # 미리 정의된 앵커 박스 -> 나중에 커스텀 앵커박스로 수정해야함.
            {
                'class_name': car,
                'anchor_sizes': [[4.63, 1.97, 1.74]],
                'anchor_rotations': [0, 1.57],
                'anchor_bottom_heights': [-0.95],
